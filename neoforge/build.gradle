plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'

    id "me.shedaniel.unified-publishing" version "0.1.+"
}

repositories {
    maven { url = "https://api.modrinth.com/maven" }
    maven {
        url "https://www.cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
}

neoForge {
    version = neoforge_version
    // Automatically enable neoforge AccessTransformers if the file exists
    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})" // Unify the run config names with fabric
        }
        client {
            client()
        }
        data {
            clientData()

            // DataGen can be run by - "./gradlew :neoforge:runData" in Terminal.
            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()

        }
        server {
            server()
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources.srcDir 'src/generated/resources'

def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements'].each { variant ->
    configurations.named("$variant") {
        attributes {
            attribute(loaderAttribute, 'neoforge')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName, it.getTaskName(null, 'jarJar')].each { variant->
        configurations.named("$variant") {
            attributes {
                attribute(loaderAttribute, 'neoforge')
            }
        }
    }
}


dependencies {

    implementation "maven.modrinth:jade:${jade_version}+neoforge"

    // Mod compats

    // SWEM
    //modImplementation "curse.maven:swem-582697:6739081"
    //modImplementation "maven.modrinth:geckolib:4.8.2-forge,1.20.1"
    //modImplementation "maven.modrinth:playeranimator:1.0.2-rc1+1.20-forge"

    //modImplementation "curse.maven:swem_addendum-1164205:7039235"
}

unifiedPublishing {
    def mod_version = version
    project {
        displayName = "${mod_name} (NeoForge) - v${mod_version} - ${minecraft_version}" // Optional, name of the file
        version = "${mod_version}" // Optional, Inferred from project by default
        changelog = rootProject.file("CHANGELOG.md").text // Optional, in markdown format
        releaseType = "release" // Optional, use "release", "beta" or "alpha"
        gameVersions = ["1.21.11"]
        gameLoaders = ["neoforge"]

        mainPublication tasks.named('jar', Jar).flatMap { it.archiveFile } // Declares the publicated jar

        relations {
            depends {
                curseforge = "jade"
                modrinth = "jade"
            }
            /*optional {
                curseforge = "swem"
                modrinth = "swem"
            }*/
        }

        var cfToken = System.getenv("CURSEFORGE_TOKEN")
        if (cfToken != null) {
            curseforge {
                token = System.getenv("CURSEFORGE_TOKEN")
                id = "1414723" // Required, must be a string, ID of CurseForge project
                /*relations {
                    optional "swem-addendum"
                }*/
            }
        }


        var mrToken = System.getenv("MODRINTH_TOKEN")
        if (mrToken != null) {
            modrinth {
                token = System.getenv("MODRINTH_TOKEN")
                id = "GAJkSU0A" // Required, must be a string, ID of Modrinth project
            }
        }
    }
}
