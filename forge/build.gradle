plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev.legacyforge'

    id "me.shedaniel.unified-publishing" version "0.1.+"
}

mixin {
    //add(sourceSets.main, "${mod_id}.refmap.json")

    config("${mod_id}.mixins.json")
    config("${mod_id}.forge.mixins.json")
}

repositories {
    maven { url = "https://api.modrinth.com/maven" }
    maven {
        url "https://www.cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
}

legacyForge {
    version = "${minecraft_version}-${forge_version}"

    validateAccessTransformers = true

    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers = ["src/main/resources/META-INF/accesstransformer.cfg"]
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
    runs {
        client {
            client()
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
        server {
            server()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources.srcDir 'src/generated/resources'

dependencies {
    compileOnly project(":common")
    annotationProcessor("org.spongepowered:mixin:0.8.5-SNAPSHOT:processor")

    modImplementation "maven.modrinth:jade:${jade_version}+forge"

    // Mod compats

    // SWEM
    modImplementation "curse.maven:swem-582697:6739081"
    modImplementation "maven.modrinth:geckolib:4.8.2-forge,1.20.1"
    modImplementation "maven.modrinth:playeranimator:1.0.2-rc1+1.20-forge"

    modImplementation "curse.maven:swem_addendum-1164205:7039235"
}

jar {
    finalizedBy('reobfJar')
    manifest.attributes([
            "MixinConfigs": "${mod_id}.mixins.json,${mod_id}.forge.mixins.json"
    ])
}

unifiedPublishing {
    def mod_version = version
    project {
        displayName = "${mod_name} (Forge) - v${mod_version} - ${minecraft_version}" // Optional, name of the file
        version = "${mod_version}" // Optional, Inferred from project by default
        changelog = rootProject.file("CHANGELOG.md").text // Optional, in markdown format
        releaseType = "release" // Optional, use "release", "beta" or "alpha"
        gameVersions = ["1.20.1", "1.20.2", "1.20.3"]
        gameLoaders = ["forge"]

        mainPublication tasks.named('jar', Jar).flatMap { it.archiveFile } // Declares the publicated jar

        relations {
            depends {
                curseforge = "jade"
                modrinth = "jade"
            }
            optional {
                curseforge = "swem"
                modrinth = "swem"
            }
        }

        var cfToken = System.getenv("CURSEFORGE_TOKEN")
        if (cfToken != null) {
            curseforge {
                token = System.getenv("CURSEFORGE_TOKEN")
                id = "1414723" // Required, must be a string, ID of CurseForge project
                relations {
                    optional "swem-addendum"
                }
            }
        }


        var mrToken = System.getenv("MODRINTH_TOKEN")
        if (mrToken != null) {
            modrinth {
                token = System.getenv("MODRINTH_TOKEN")
                id = "GAJkSU0A" // Required, must be a string, ID of Modrinth project
            }
        }
    }
}
