plugins {
    id 'multiloader-loader'
    id 'fabric-loom'

    id "me.shedaniel.unified-publishing" version "0.1.+"
}

repositories {
    maven { url = "https://api.modrinth.com/maven" }
    maven {
        url "https://www.cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        name = "Fuzs Mod Resources"
        url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/"
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    modImplementation "maven.modrinth:jade:${jade_version}+fabric"

    // Doggy Talents Next
    modImplementation "maven.modrinth:doggy-talents-next:1.18.63-fabric,1.21.1"
    modApi "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:21.1.6"
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}

unifiedPublishing {
    def mod_version = version
    project {
        displayName = "${mod_name} (Fabric) - v${mod_version} - ${minecraft_version}" // Optional, name of the file
        version = "${mod_version}" // Optional, Inferred from project by default
        changelog = rootProject.file("CHANGELOG.md").text // Optional, in markdown format
        releaseType = "release" // Optional, use "release", "beta" or "alpha"
        gameVersions = ["1.21.1"]
        gameLoaders = ["fabric"]

        mainPublication tasks.named('remapJar').flatMap { it.archiveFile } // Declares the publicated jar

        relations {
            depends {
                curseforge = "jade"
                modrinth = "jade"
            }
            optional {
                curseforge = "swem"
                modrinth = "swem"
            }
            optional {
                curseforge = "doggy-talents-next"
                modrinth = "doggy-talents-next"
            }
        }

        var cfToken = System.getenv("CURSEFORGE_TOKEN")
        if (cfToken != null) {
            curseforge {
                token = System.getenv("CURSEFORGE_TOKEN")
                id = "1414723" // Required, must be a string, ID of CurseForge project
            }
        }


        var mrToken = System.getenv("MODRINTH_TOKEN")
        if (mrToken != null) {
            modrinth {
                token = System.getenv("MODRINTH_TOKEN")
                id = "GAJkSU0A" // Required, must be a string, ID of Modrinth project
            }
        }
    }
}
